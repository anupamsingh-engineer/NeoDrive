# Reverse proxy for metric.neodrive.anupamsingh.xyz -> the `grafana` container's published port.
#
# Deployed by hand, not by Docker Compose or CI - see docs/ec2-deployment.md "Expose Grafana via
# nginx". After `certbot --nginx -d metric.neodrive.anupamsingh.xyz`, certbot rewrites this file in
# place to add the `listen 443 ssl` block and the HTTP->HTTPS redirect - don't hand-add TLS
# directives here yourself, or certbot's rewrite may not apply the way it expects.
#
# Assumes the grafana container's port is published to the host as 127.0.0.1:3001 (loopback only,
# not 0.0.0.0) - nginx is the only thing that should ever reach it directly. Auth is Grafana's own
# login (GF_SECURITY_ADMIN_PASSWORD, anonymous access is off) - see docker-compose.yml.

server {
    listen 80;
    listen [::]:80;
    server_name metric.neodrive.anupamsingh.xyz;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana's live dashboard updates and Explore view use WebSockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
