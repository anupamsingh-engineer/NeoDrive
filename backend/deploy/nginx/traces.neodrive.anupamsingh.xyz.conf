# Reverse proxy for traces.neodrive.anupamsingh.xyz -> the `jaeger` container's UI port.
#
# Deployed by hand, not by Docker Compose or CI - see docs/ec2-deployment.md "Expose Grafana via
# nginx" (Jaeger piggybacks on the same pattern). After `certbot --nginx -d
# traces.neodrive.anupamsingh.xyz`, certbot rewrites this file in place to add the
# `listen 443 ssl` block and the HTTP->HTTPS redirect - don't hand-add TLS directives here
# yourself, or certbot's rewrite may not apply the way it expects.
#
# Assumes the jaeger container's UI port is published to the host as 127.0.0.1:16686 (loopback
# only, not 0.0.0.0). UNLIKE Grafana, Jaeger has no login of its own - auth_basic below is the
# ONLY thing standing between the public internet and your traces, so don't remove it. Create the
# password file first:
#   sudo apt-get install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-traces admin

server {
    listen 80;
    listen [::]:80;
    server_name traces.neodrive.anupamsingh.xyz;

    location / {
        auth_basic "Traces";
        auth_basic_user_file /etc/nginx/.htpasswd-traces;

        proxy_pass http://127.0.0.1:16686;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
