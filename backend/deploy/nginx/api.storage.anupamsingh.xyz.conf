# Reverse proxy for api.storage.anupamsingh.xyz -> the `app` container's published port.
#
# Deployed by hand, not by Docker Compose or CI - see docs/ec2-deployment.md step 7. After
# `certbot --nginx -d api.storage.anupamsingh.xyz` (step 8), certbot rewrites this file in place
# to add the `listen 443 ssl` block and the HTTP->HTTPS redirect - don't hand-add TLS directives
# here yourself, or certbot's rewrite may not apply the way it expects.
#
# Assumes the app container's port is published to the host as 127.0.0.1:4000 (loopback only,
# not 0.0.0.0) - nginx is the only thing that should ever reach it directly.

server {
    listen 80;
    listen [::]:80;
    server_name api.storage.anupamsingh.xyz;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Preserves the original request for Express's `trust proxy` (app.js) - req.ip and
        # the secure/sameSite cookie logic (src/utils/cookies.js) depend on these being accurate.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade headers are harmless even though this API has no websocket routes today.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
