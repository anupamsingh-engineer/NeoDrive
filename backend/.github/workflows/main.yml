name: Deploy StorageApp Backend (Docker)

# Full walkthrough, including the one-time EC2/nginx/certbot setup and the repo secrets this
# workflow needs, is in backend/docs/ec2-deployment.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Setup SSH key and known_hosts. SSH_PRIVATE_KEY is the EC2 access key (from launching
      #    the instance) that lets this runner log in as EC2_USER - not the separate GitHub
      #    deploy key generated on the box itself for `git pull` (see docs/ec2-deployment.md
      #    step 4), which never leaves the server.
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 2. Deploy: pull the latest code and bring the stack up via Docker Compose. `migrate`
      #    and `redis` come up automatically as dependencies of app/worker even though they're
      #    not named explicitly (see docs/ec2-deployment.md "Instance sizing" for why this
      #    workflow deploys the minimal service set rather than the full observability stack).
      - name: Deploy on EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
          REMOTE_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh -i ~/.ssh/id_rsa "${SSH_USER}@${SSH_HOST}" "bash -s" << EOF
            set -e

            cd ${REMOTE_APP_DIR}
            git pull --ff-only origin main

            echo "Building and starting containers..."
            docker compose up --build -d app worker

            echo "Pruning dangling images from the previous build..."
            docker image prune -f

            echo "Backend deployed successfully."
          EOF
