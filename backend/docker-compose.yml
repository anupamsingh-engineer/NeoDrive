# Pinned so this project resolves to the same name (and therefore the same containers/volumes)
# whether you run `docker compose` from here directly or from the repo root via its
# docker-compose.yml `include:`, which would otherwise default to "storage-app" instead.
name: neodrive

services:
  app:
    build: .
    # Loopback-only: in production, nginx (host-installed, see docs/ec2-deployment.md) is the
    # only thing that should reach this port directly - it's never exposed to the network
    # interface itself. Still reachable at http://localhost:4000 for local dev either way.
    ports:
      - "127.0.0.1:4000:4000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "--import", "./instrumentation.js", "src/worker.js"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    # The image's HEALTHCHECK curls :4000/healthz, which only the app process serves - the
    # worker has no HTTP server, so that check can never pass. Disable it here rather than
    # reporting a false "unhealthy".
    healthcheck:
      disable: true

  # One-shot: creates indexes (unique email, OTP/refresh-token TTL cleanup, etc.) before
  # app/worker start. migrate-mongo is a regular dependency (not dev-only) specifically so
  # it's present in this same production image - see package.json. DB_URL comes from .env
  # (MongoDB Atlas), so there's no local mongo/mongo-init service to wait on.
  migrate:
    build: .
    command: ["npm", "run", "migrate:up"]
    env_file: .env
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    # Loopback-only like `app` above - view remotely via `ssh -L 9090:localhost:9090`, never
    # expose this port directly on a public box (no auth in front of Prometheus itself).
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Copy metrics_token.example -> metrics_token (gitignored) and, if METRICS_TOKEN is set
      # in .env, put the same value in there so Prometheus can authenticate its scrapes.
      - ./docker/prometheus/metrics_token:/etc/prometheus/secrets/metrics_token:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    # Loopback-only - view remotely via `ssh -L 3001:localhost:3001`. Anonymous Viewer access is
    # enabled below for local-dev convenience, which is exactly why this shouldn't be reachable
    # from the public internet on a real box.
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # Loopback-only for the UI - view remotely via `ssh -L 16686:localhost:16686`. The OTLP port
    # doesn't need a host mapping at all in production: app/worker reach it over the internal
    # Compose network as `http://jaeger:4318`, never through the host.
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318" # OTLP/http

volumes:
  # Explicit names (matching what the "backend"-named project originally created, before it was
  # renamed to "storage-app" and then "neodrive") so they stay stable and keep their existing
  # data regardless of the project name above - otherwise Compose would derive new, empty
  # volumes every time the project name changes.
  redis_data:
    name: backend_redis_data
  grafana_data:
    name: backend_grafana_data
