# Pinned so this project resolves to the same name (and therefore the same containers/volumes)
# whether you run `docker compose` from here directly or from the repo root via its
# docker-compose.yml `include:`, which would otherwise default to "storage-app" instead.
name: storage-app

services:
  app:
    build: .
    # Loopback-only: in production, nginx (host-installed, see docs/ec2-deployment.md) is the
    # only thing that should reach this port directly - it's never exposed to the network
    # interface itself. Still reachable at http://localhost:4000 for local dev either way.
    ports:
      - "127.0.0.1:4000:4000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "--import", "./instrumentation.js", "src/worker.js"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    # The image's HEALTHCHECK curls :4000/healthz, which only the app process serves - the
    # worker has no HTTP server, so that check can never pass. Disable it here rather than
    # reporting a false "unhealthy".
    healthcheck:
      disable: true

  # One-shot: creates indexes (unique email, OTP/refresh-token TTL cleanup, etc.) before
  # app/worker start. migrate-mongo is a regular dependency (not dev-only) specifically so
  # it's present in this same production image - see package.json. DB_URL comes from .env
  # (MongoDB Atlas), so there's no local mongo/mongo-init service to wait on.
  migrate:
    build: .
    command: ["npm", "run", "migrate:up"]
    env_file: .env
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP/http

volumes:
  # Explicit names (matching what the "backend"-named project already created) so they stay
  # stable and keep their data now that the project itself is named "storage-app" above -
  # otherwise Compose would derive new, empty volumes from the new project name.
  redis_data:
    name: backend_redis_data
  grafana_data:
    name: backend_grafana_data
