server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # nginx's add_header does NOT inherit into a location block that declares its own
    # add_header - it's replaced, not merged - so these three are repeated in every location
    # below rather than declared once at server level. index.html's CSP <meta> tag can't set
    # these itself - browsers only honor them as real HTTP response headers.
    location /assets/ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Hashed build assets (Vite's [name].[hash].js/css) are safe to cache forever.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must always be revalidated, or clients would keep loading an old
    # bundle's now-orphaned hashed asset URLs after a new deploy.
    location = /index.html {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }

    # SPA client-side routing: unmatched paths fall through to index.html, not a 404.
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
