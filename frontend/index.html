<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy: allows our own bundle, the backend API (a different origin
         from this frontend — %VITE_API_ORIGIN% is Vite's HTML env replacement, see
         .env.local), direct browser-to-S3 uploads (presigned PUT URLs, see
         pages/app/drive), Google Identity Services (Google sign-in button), and Razorpay
         Checkout (subscription payments) — the only things this app actually loads/calls.
         NOTE: X-Frame-Options and X-Content-Type-Options must be set as HTTP response
         headers (nginx/CDN config) — browsers ignore them in <meta> tags. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://accounts.google.com https://checkout.razorpay.com;
        connect-src 'self' %VITE_API_ORIGIN% https://*.amazonaws.com https://accounts.google.com https://api.razorpay.com;
        frame-src 'self' https://accounts.google.com https://api.razorpay.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https: %VITE_API_ORIGIN%;
        media-src 'self' https: %VITE_API_ORIGIN%;
        font-src 'self' data:;
      "
    />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Upload, organize, and access your files from any device." />
    <meta name="robots" content="index, follow" />

    <title>Storage App</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
