name: Deploy StorageApp Frontend (S3 + CloudFront)

# Full walkthrough, including the one-time S3/CloudFront/ACM/DNS setup and the repo secrets this
# workflow needs, is in frontend/docs/s3-cloudfront-deployment.md.
#
# Lives at the repo ROOT .github/workflows/ (not frontend/.github/workflows/) because that's the
# only place GitHub Actions ever looks. The `paths` filter below is what makes this run only for
# frontend changes - see deploy-backend.yml for its mirror image, and
# frontend/docs/build-and-deploy.md for the full monorepo-triggering explanation.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # VITE_* vars are baked into the JS bundle at build time - there's no runtime config for a
      # static build, so these must be set here as build-step env vars, not on the S3/CloudFront
      # side afterward. See frontend/docs/environment-variables.md.
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_ORIGIN: ${{ secrets.VITE_API_ORIGIN }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Two-pass upload so hashed assets (Vite's [name].[hash].js/css - safe to cache forever)
      # and index.html (must always be revalidated, or clients keep loading an old bundle's
      # now-deleted hashed asset URLs after a new deploy) get different Cache-Control headers -
      # same split nginx.conf uses for the Docker/EC2 deployment path, see
      # frontend/docs/build-and-deploy.md.
      - name: Sync build to S3
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET_NAME }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp dist/index.html "s3://${{ secrets.S3_BUCKET_NAME }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
